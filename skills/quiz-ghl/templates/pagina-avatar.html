<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{MARCA}} · {{AVATAR_NOME}}</title>
<!-- Página por avatar · template do repositório ghl-funil-quiz (MIT).
     Mesma estrutura pra todos os avatares; o CONTEÚDO (dor, prova, objeção, oferta) é de cada um.
     Não troque só a headline: é exatamente isso que faz o quiz não converter. -->
<style>
  :root{--cor:{{COR}};--ink:#0f172a;--mute:#64748b;--line:#e2e8f0}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#f8fafc;color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.5}
  .pg{max-width:760px;margin:0 auto;background:#fff;min-height:100vh}
  .top{background:var(--ink);color:#fff;padding:10px 20px;font-size:.85rem;font-weight:700}
  .hero{padding:38px 22px 28px;text-align:center;background:linear-gradient(160deg,#faf5ff,#fff)}
  .kick{display:inline-block;background:#ede9fe;color:var(--cor);font-weight:900;font-size:.72rem;letter-spacing:1px;text-transform:uppercase;padding:5px 12px;border-radius:100px;margin-bottom:12px}
  h1{font-size:clamp(1.45rem,4vw,2.15rem);line-height:1.18;letter-spacing:-.4px;margin-bottom:10px}
  h1 mark{background:linear-gradient(transparent 58%,#fde68a 58%);color:inherit}
  .hero p{color:var(--mute);max-width:560px;margin:0 auto;font-size:1.02rem}
  .sec{padding:24px 22px;border-top:1px solid var(--line)}
  .sec h2{font-size:1.12rem;margin-bottom:12px}
  .dor{display:flex;gap:10px;margin-bottom:9px}.dor span{color:#dc2626;font-weight:900}
  .mec{background:#f5f3ff;border-left:4px solid var(--cor);border-radius:10px;padding:14px 16px}
  .dep{border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 4px 16px rgba(15,23,42,.05)}
  .dep b{display:block;margin-top:8px;font-size:.86rem}
  .faq{border:1px solid var(--line);border-radius:12px;padding:14px 16px}.faq b{display:block;margin-bottom:6px}
  .oferta{margin:6px 22px 30px;background:var(--ink);color:#fff;border-radius:16px;padding:24px;text-align:center}
  .oferta p{opacity:.9;margin-bottom:14px}
  .cta{display:block;max-width:440px;margin:0 auto;background:#16a34a;color:#fff;text-decoration:none;border-radius:12px;padding:17px;font-weight:900;font-size:1.05rem}
</style>
</head>
<body>
<div class="pg">
  <div class="top">{{MARCA}}</div>
  <div class="hero">
    <span class="kick">Para {{AVATAR_NOME}}</span>
    <h1 id="hl">{{HEADLINE}}</h1>
    <p>{{SUB}}</p>
  </div>
  <div class="sec"><h2>Você se reconhece aqui?</h2>{{DORES}}</div>
  <div class="sec"><h2>Como a gente resolve</h2><div class="mec">{{MECANISMO}}</div></div>
  <div class="sec"><h2>Quem já passou por isso</h2><div class="dep">{{PROVA_TEXTO}}<b>{{PROVA_AUTOR}}</b></div></div>
  <div class="sec"><div class="faq"><b>{{OBJ_PERGUNTA}}</b><p>{{OBJ_RESPOSTA}}</p></div></div>
  <div class="oferta"><p>{{OFERTA}}</p><a class="cta" id="cta" href="{{CTA_URL}}">{{CTA}} →</a></div>
</div>
<script>
// Personaliza com o ?nome= que o quiz manda e repassa as UTMs pro link do CTA.
(function(){
  var qs = new URLSearchParams(location.search), nome = (qs.get('nome') || '').trim();
  var hl = document.getElementById('hl');
  var safe = nome.replace(/[<>&"']/g, '');
  hl.innerHTML = hl.innerHTML.replace(/\{nome\}/g, safe || 'Olá');
  document.title = document.title.replace(/\{nome\}/g, safe);
  var cta = document.getElementById('cta');
  if (/^https?:/.test(cta.getAttribute('href')) && cta.href.indexOf('wa.me') === -1) {
    try { var u = new URL(cta.href); qs.forEach(function(v, k){ if (!u.searchParams.has(k)) u.searchParams.set(k, v); }); cta.href = u.href; } catch(e){}
  }
})();
</script>
</body>
</html>
